<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Vehicle | Rent&Go</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="add">

    <!-- ================= HEADER ================= -->
    <header class="header">
        <a href="index.html" class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-location-dot"></i>
                <i class="fa-solid fa-car-side"></i>
            </div>
            <div>
                <h1>Rent<span>&</span>Go</h1>
                <p>Drive · Ride · Share</p>
            </div>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="vehicles.html">Vehicles</a>
            <a href="add-vehicle.html" style="color:#0863a8;">Add Vehicle</a>
        </nav>

        <div class="header-buttons">
            <a class="login-btn" href="auth.html?mode=login">Login</a>
            <a class="signup-btn" href="auth.html?mode=signup">Sign Up</a>
            <button class="menu-btn"><i class="fa-solid fa-bars"></i></button>
        </div>
    </header>

    <!-- ================= ADD FORM ================= -->
    <div class="add-wrap">

        <h2><i class="fa-solid fa-car-side"></i> Add Your Vehicle</h2>
        <p class="subtitle">Share your vehicle and earn. Fill in the details below.</p>

        <form id="addVehicleForm" novalidate>

            <div class="form-row">

                <div class="form-group">
                    <label>Vehicle Name</label>
                    <input type="text" id="id_name" placeholder="e.g. Swift">
                </div>

                <div class="form-group">
                    <label>Brand</label>
                    <input type="text" id="id_brand" placeholder="e.g. Maruti Suzuki">
                </div>

                <div class="form-group">
                    <label>Type</label>
                    <select id="id_type">
                        <option value="car">Car</option>
                        <option value="bike">Bike</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Model Year</label>
                    <input type="number" id="id_year" min="1990" max="2026" value="2020">
                </div>

                <div class="form-group">
                    <label>Price per Day (₹)</label>
                    <input type="number" id="id_price" min="1" placeholder="e.g. 1200">
                </div>

                <div class="form-group">
                    <label>Photo (URL or path)</label>
                    <input type="text" id="id_image" placeholder="e.g. images/car-card.png">
                </div>

                <div class="form-group" style="grid-column:1 / -1;">
                    <label>Location (City / Area)</label>
                    <input type="text" id="id_location" placeholder="e.g. Pune">
                </div>

                <div class="form-group">
                    <label>Latitude</label>
                    <input type="text" id="id_latitude" placeholder="18.5204">
                </div>

                <div class="form-group">
                    <label>Longitude</label>
                    <input type="text" id="id_longitude" placeholder="73.8567">
                </div>

                <div class="form-group" style="grid-column:1 / -1;">
                    <label>Description</label>
                    <textarea id="id_description" rows="4" placeholder="Describe your vehicle"></textarea>
                </div>

                <div class="form-group" style="grid-column:1 / -1;">
                    <label><input type="checkbox" id="id_available" checked style="width:auto;"> Available for rent?</label>
                </div>

            </div>

            <div class="loc-bar">
                <button type="button" class="near-me" id="locateBtn">
                    <i class="fa-solid fa-location-crosshairs"></i> Use My Current Location
                </button>
                <span class="loc-status" id="locateStatus"></span>
            </div>

            <div class="add-actions">
                <button class="primary-btn" type="submit">
                    <i class="fa-solid fa-plus"></i> Add Vehicle
                </button>
            </div>

        </form>

    </div>

    <!-- ================= FOOTER ================= -->
    <footer>
        <h2>Rent<span>&</span>Go</h2>
        <p>Drive · Ride · Share</p>
        <p class="copyright">&copy; 2026 Rent&amp;Go. All Rights Reserved.</p>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
