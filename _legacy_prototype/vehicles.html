<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicles | Rent&Go</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="vehicles">

    <!-- ================= HEADER ================= -->
    <header class="header">
        <a href="index.html" class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-location-dot"></i>
                <i class="fa-solid fa-car-side"></i>
            </div>
            <div>
                <h1>Rent<span>&</span>Go</h1>
                <p>Drive · Ride · Share</p>
            </div>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="vehicles.html" style="color:#0863a8;">Vehicles</a>
            <a href="add-vehicle.html">Add Vehicle</a>
        </nav>

        <div class="header-buttons">
            <a class="login-btn" href="auth.html?mode=login">Login</a>
            <a class="signup-btn" href="auth.html?mode=signup">Sign Up</a>
            <button class="menu-btn"><i class="fa-solid fa-bars"></i></button>
        </div>
    </header>

    <!-- ================= FILTERS ================= -->
    <div class="filter-bar">

        <form class="filter-form" id="filterForm">
            <div class="filter-field">
                <i class="fa-solid fa-car"></i>
                <select id="filterType">
                    <option value="">All Vehicles</option>
                    <option value="car">Cars</option>
                    <option value="bike">Bikes</option>
                </select>
            </div>

            <div class="filter-field grow">
                <i class="fa-solid fa-location-dot"></i>
                <input type="text" id="filterLocation" placeholder="City / area">
            </div>

            <button class="filter-btn" type="submit">Filter</button>
        </form>

        <button class="near-me" id="nearMeBtn">
            <i class="fa-solid fa-location-crosshairs"></i> Vehicles Near Me
        </button>

    </div>

    <div class="near-me-hint" id="nearMeHint">
        <i class="fa-solid fa-location-crosshairs"></i>
        Click <strong>&ldquo;Vehicles Near Me&rdquo;</strong> to allow location access and we&rsquo;ll show vehicles sorted by distance from you.
    </div>

    <div class="result-bar">
        <p><strong id="resultCount">0</strong> vehicles found</p>
        <span id="geoStatus"></span>
    </div>

    <!-- ================= LISTING ================= -->
    <section class="vehicles-section">

        <div class="section-title-row">
            <h2><i class="fa-solid fa-car-side"></i> Available Vehicles</h2>
            <a class="view-all" href="add-vehicle.html">+ Add your vehicle</a>
        </div>

        <div class="v-grid" id="vehiclesGrid"></div>

    </section>

    <!-- ================= FOOTER ================= -->
    <footer>
        <h2>Rent<span>&</span>Go</h2>
        <p>Drive · Ride · Share</p>
        <p class="copyright">&copy; 2026 Rent&amp;Go. All Rights Reserved.</p>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
